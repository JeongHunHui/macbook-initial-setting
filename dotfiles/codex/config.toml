model = "gpt-5.6-sol"
model_reasoning_effort = "low"
disable_paste_burst = true

[tui]
alternate_screen = "never"
raw_output_mode = false

[tui.keymap.composer]
submit = "enter"

[tui.keymap.editor]
insert_newline = "shift-enter"
move_up = "up"
move_down = "down"
move_line_start = "ctrl-a"
move_line_end = "ctrl-e"
